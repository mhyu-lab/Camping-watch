name: 캠핑장 빈자리 감시

# 한 번 실행되면 약 5시간 50분 동안 10초마다 확인한다.
# 30분마다 예약된 다음 실행은 앞 실행이 끝날 때까지 대기했다가 이어받는다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "감시 시간(초)"
        default: "21000"

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 이전 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 빈자리 확인 (10초마다)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INTERVAL: "10"
          DURATION: ${{ inputs.duration || '21000' }}
        run: python3 watch.py

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
