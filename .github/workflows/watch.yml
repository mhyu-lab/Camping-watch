name: 캠핑장 빈자리 감시

# 한 번 실행되면 약 5시간 50분 동안 10초마다 확인하고, 끝날 때 다음 실행을 직접 시작한다.
# 30분마다 예약된 실행은 이어달리기가 끊겼을 때를 대비한 예비다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "테스트 알림만 보내기"
        type: boolean
        default: false
      duration:
        description: "감시 시간(초)"
        default: "21000"

jobs:
  # 감시 중에도 바로 실행되도록 concurrency 그룹 밖에 둔다
  test-notify:
    if: ${{ inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 알림 보내기
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: "1"
        run: python3 watch.py

  watch:
    if: ${{ !inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write   # 다음 실행 시작용
      contents: write  # 감시 현황(status 브랜치) 기록용
    concurrency:
      group: watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 이전 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 빈자리 확인 (10초마다)
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          UUC_SESSION: ${{ secrets.UUC_SESSION }}
          INTERVAL: "10"
          DURATION: ${{ inputs.duration || '21000' }}
        run: python3 watch.py

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # 수동 취소가 아니고 감시할 날짜가 남았으면 다음 감시를 바로 시작한다.
      # 새 실행은 이 작업이 끝날 때까지 대기했다가 이어받는다.
      - name: 다음 감시 시작
        if: ${{ !cancelled() && steps.check.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
