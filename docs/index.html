<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠핑 감시">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<title>캠핑 감시</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1c1d1f; --muted: #6b6f75; --line: #e6e4de;
    --ok: #1f8a4c; --ok-bg: #e3f4ea; --warn: #b26a00; --warn-bg: #fdf0dc;
    --bad: #c0352b; --bad-bg: #fbe5e3; --full: #8a8e94;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --card: #202327; --text: #eceef0; --muted: #9aa0a6; --line: #2e3237;
      --ok: #4cc17f; --ok-bg: #173826; --warn: #f0b04a; --warn-bg: #3a2c12;
      --bad: #ff7a6e; --bad-bg: #3d1d1a; --full: #7d838a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .label { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .row div { flex: 1; }
  .num { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dates { list-style: none; margin: 0; padding: 0; }
  .dates li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .dates li:first-child { border-top: 0; padding-top: 0; }
  .dates li:last-child { padding-bottom: 0; }
  .seat { font-weight: 600; color: var(--full); }
  .seat.open { color: var(--ok); }
  a.book { color: #fff; background: var(--ok); text-decoration: none; padding: 6px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-left: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>맑은터공원 까산이존</h1>
      <p class="sub" id="ago">불러오는 중…</p>
    </div>
    <span class="pill warn" id="pill">확인 중</span>
  </header>

  <section class="card">
    <div class="label">총 감시 횟수</div>
    <div class="big" id="total">–</div>
    <div class="row">
      <div><div class="label">이번 실행</div><div class="num" id="run">–</div></div>
      <div><div class="label">조회 실패</div><div class="num" id="failed">–</div></div>
      <div><div class="label">간격</div><div class="num" id="interval">–</div></div>
    </div>
    <p class="muted" id="since"></p>
  </section>

  <section class="card">
    <div class="label" style="margin-bottom:12px">날짜별 잔여</div>
    <ul class="dates" id="dates"></ul>
  </section>

  <section class="card">
    <div class="label">마지막 빈자리 알림</div>
    <div id="alert" class="num" style="font-size:15px;font-weight:500">없음</div>
  </section>

  <p class="muted">1분마다 자동으로 새로고침돼요. <span id="msg"></span></p>
</main>
<script>
const STATUS_URL = "https://api.github.com/repos/mhyu-lab/Camping-watch/contents/status.json?ref=status";
const BOOKING_URL = "https://forest.maketicket.co.kr/ticket/GD82";
let data = null;

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("ko-KR");
const dateLabel = d => {
  const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  return `${dt.getMonth() + 1}/${dt.getDate()} (${"일월화수목금토"[dt.getDay()]})`;
};
const timeLabel = iso => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

function agoText(sec) {
  if (sec < 60) return `${sec}초 전`;
  if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
  return `${Math.floor(sec / 3600)}시간 ${Math.floor(sec % 3600 / 60)}분 전`;
}

function tick() {
  if (!data) return;
  const sec = Math.max(0, Math.round((Date.now() - new Date(data.updated_at)) / 1000));
  $("ago").textContent = `마지막 업데이트 ${agoText(sec)}`;
  const pill = $("pill");
  if (data.state === "finished") { pill.className = "pill warn"; pill.textContent = "감시 종료"; }
  else if (data.consecutive_fails >= 3) { pill.className = "pill bad"; pill.textContent = "조회 실패 중"; }
  else if (sec <= 180) { pill.className = "pill ok"; pill.textContent = "● 감시 중"; }
  else if (sec <= 600) { pill.className = "pill warn"; pill.textContent = "교대 중"; }
  else { pill.className = "pill bad"; pill.textContent = "멈춤"; }
}

function render() {
  $("total").textContent = fmt(data.total_checks) + "회";
  $("run").textContent = fmt(data.run.checks) + "회";
  $("failed").textContent = fmt(data.failed_checks) + "회";
  $("interval").textContent = data.interval + "초";
  $("since").textContent = `${timeLabel(data.since)}부터 누적`;
  const ul = $("dates");
  ul.innerHTML = "";
  const dates = Object.keys(data.results).sort();
  if (!dates.length) ul.innerHTML = '<li class="muted">감시할 날짜가 없어요.</li>';
  for (const d of dates) {
    for (const zone of data.zones) {
      const n = data.results[d][zone];
      const li = document.createElement("li");
      const left = document.createElement("span");
      left.textContent = data.zones.length > 1 ? `${dateLabel(d)} · ${zone}` : dateLabel(d);
      const right = document.createElement("span");
      const seat = document.createElement("span");
      seat.className = "seat" + (n > 0 ? " open" : "");
      seat.textContent = n == null ? "확인 전" : n > 0 ? `잔여 ${n}` : "만석";
      right.append(seat);
      if (n > 0) {
        const a = document.createElement("a");
        a.className = "book"; a.href = BOOKING_URL; a.textContent = "예약";
        right.append(a);
      }
      li.append(left, right);
      ul.append(li);
    }
  }
  $("alert").textContent = data.last_alert ? `${timeLabel(data.last_alert.at)} · ${data.last_alert.message}` : "없음";
  tick();
}

async function load() {
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" } });
    if (res.status === 404) throw new Error("아직 감시 현황이 올라오지 않았어요.");
    if (res.status === 403 || res.status === 429) throw new Error("GitHub 조회 한도에 걸렸어요. 잠시 후 다시 시도해요.");
    if (!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
    data = await res.json();
    $("msg").textContent = "";
    $("msg").className = "";
    render();
  } catch (e) {
    $("msg").textContent = e.message;
    $("msg").className = "err";
  }
}

load();
setInterval(load, 60000);
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
